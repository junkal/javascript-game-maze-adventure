<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Adventure</title>
  <link rel="icon" type="image/png" href="assets/knight.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Timer Display -->
  <div id="timer">Time Left: ...</div>

  <div id="start-overlay">
    <div class="start-container">
      <img id="start-image" src="assets/cover.png" alt="Start Screen" />
      <div class="start-text">
        <div class="start-title">Maze Adventure</div>
        <div class="start-subtitle">Press Enter to Start</div>
      </div>
    </div>
  </div>

  <!-- Canvas container for overlay positioning -->
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Game Over Overlay -->
    <div id="game-over-overlay">Game Over</div>
    <div id="game-hint">Arrow Keys to Move · Press P to Pause</div>
  </div>
  
  <!-- Background Music -->
  <audio id="bg-music" src="assets/background_music.ogg" loop></audio>
  <audio id="gameover-sfx" src="assets/gameover.ogg" preload="auto"></audio>
  <audio id="win-sfx" src="assets/victory.ogg" preload="auto"></audio>
  <!-- Game Code -->
  <script type="module" src="js/main.js"></script>  
</body>
</html>
